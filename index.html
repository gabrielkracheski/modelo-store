<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camila's Store</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>

<body>

    <div id="tela-login">

        <svg class="icone-login" viewBox="6 4 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g transform="rotate(-45 32 32)">
                <rect x="6" y="26" width="3" height="12" rx="1" fill="currentColor" />
                <rect x="9" y="30" width="18" height="4" fill="currentColor" />
                <rect x="19" y="24" width="3" height="16" rx="1" fill="currentColor" />
                <rect x="22" y="26" width="22" height="12" rx="2" fill="#E3F0FA" stroke="currentColor"
                    stroke-width="1.5" />
                <rect x="29" y="27.5" width="15" height="9" fill="#2BB5A0" />
                <rect x="26" y="26.5" width="3" height="11" fill="currentColor" />
                <polygon points="44,26 49,30 49,34 44,38" fill="#E3F0FA" stroke="currentColor" stroke-width="1.5"
                    stroke-linejoin="round" />
                <rect x="49" y="29.5" width="4" height="5" fill="currentColor" />
                <line x1="53" y1="32" x2="61" y2="32" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </g>
        </svg>

        <h1>Login</h1>
        <input type="email" id="login-email" placeholder="E-mail">
        <input type="password" id="login-senha" placeholder="Senha">
        <button id="botao-entrar" class="botao-primario">Entrar</button>
        <button id="botao-criar-conta" class="botao-secundario">Criar conta</button>
        <p id="login-erro" style="color: red;"></p>
    </div>

    <!-- ==================== APLICAÇÃO PRINCIPAL ====================
         Escondida por padrão (style="display: none"); só aparece após login -->
    <div id="tela-app" style="display: none;">

        <div class="layout">

            <nav class="sidebar">

                <h2>Controle Vendas</h2>

                <div class="nav-lista">

                    <button class="nav-item" data-secao="compras">Compras</button>
                    <button class="nav-item" data-secao="vendas">Vendas</button>
                    <button class="nav-item" data-secao="resumo">Resumos</button>

                </div>

                <div class="sidebar-rodape">

                    <div class="usuario-logado">
                        <span id="texto-usuario-logado"></span>
                    </div>

                    <button id="botao-sair">Sair</button>
                </div>
            </nav>

            <!-- ---------- ÁREA DE CONTEÚDO ---------- -->

            <main class="conteudo">

                <section id="secao-compras" class="secao">
                    <h1>Compras</h1>

                    <!-- Botões de ação: abrem o modal (+ Compra) -->

                    <div class="acoes-compras">
                        <button id="botao-novo-compra" class="botao-primario botao-compacto" type="button">+ Nova
                            Compra</button>
                    </div>


                    <div id="modal-compra" class="modal-overlay" style="display: none;">
                        <div class="modal-conteudo">
                            <div class="modal-cabecalho">
                                <h2 id="modal-titulo">Nova Compra</h2>
                                <button id="botao-fechar-modal" class="botao-fechar" type="button">&times;</button>
                            </div>

                            <form id="form-lancamento">
                                <label for="lote">Lote:</label>
                                <input type="number" id="lote" required>

                                <label for="dataPedido">Data Pedido:</label>
                                <input type="date" id="dataPedido" required>

                                <label for="preco">Preço (R$):</label>
                                <input type="number" id="preco" step="0.01" required>

                                <label for="frete">Frete (R$):</label>
                                <input type="number" id="frete" step="0.01" required>

                                <label for="quantidade">Quantidade:</label>
                                <input type="number" id="quantidade" required>

                                <label for="entrega">Entrega:</label>
                                <select id="entrega" required>
                                    <option value="Sim">Sim</option>
                                    <option value="Não">Não</option>
                                </select>

                                <label for="dataEntrega">Data Entrega:</label>
                                <input type="date" id="dataEntrega">

                                <!-- Texto do botão alterna entre "Adicionar"/"Salvar alteração" via JS -->
                                <button type="submit">Adicionar</button>
                            </form>
                        </div>
                    </div>

                    <!-- ============ BARRA DE FILTROS ============
                         Cada campo dispara renderizar() no evento "change" (ver script.js).
                         O filtro não altera o array "lancamentos" original, só o que é exibido -->
                    <p class="rotulo-secao">Filtros</p>
                    <div class="barra-filtros">
                        <div class="campo">
                            <label for="filtro-data-inicio-pedido">Pedido de:</label>
                            <input type="date" id="filtro-data-inicio-pedido">
                        </div>

                        <div class="campo">
                            <label for="filtro-data-fim-pedido">Até:</label>
                            <input type="date" id="filtro-data-fim-pedido">
                        </div>

                        <div class="campo">
                            <label for="filtro-entrega">Entrega:</label>
                            <select id="filtro-entrega">
                                <option value="">Todas</option>
                                <option value="Sim">Sim</option>
                                <option value="Não">Não</option>
                            </select>
                        </div>
                        <button id="botao-limpar-filtros" class="botao-secundario" type="button">Limpar filtros</button>
                    </div>

                    <div class="tabela-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <!-- Checkbox "selecionar todos" da página atual (ver seleção em massa) -->
                                    <th><input type="checkbox" id="selecionar-todos"></th>
                                    <th>Lote</th>
                                    <th>Data Pedido</th>
                                    <th>Preço</th>
                                    <th>Frete</th>
                                    <th>Quantidade</th>
                                    <th>Total</th>
                                    <th>Entrega</th>
                                    <th>Data Entrega</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="lista-compras"></tbody>
                        </table>
                    </div>

                    <!-- Contador de total + ações sobre os itens selecionados -->
                    <div class="rodape-tabela">
                        <span id="texto-total-compras"></span>

                        <div class="acoes-selecao">
                            <span id="texto-selecionados"></span>
                            <button id="botao-excluir-selecionados" class="botao-secundario botao-compacto"
                                type="button" disabled>Excluir selecionados</button>
                        </div>
                    </div>

                    <!-- Paginação: navega pelos lançamentos filtrados, itensPorPagina de cada vez -->
                    <div class="paginacao">
                        <button id="botao-pagina-anterior" type="button">Anterior</button>
                        <span id="texto-pagina">Página 1 de 1</span>
                        <button id="botao-pagina-proxima" type="button">Próxima</button>
                        <div class="campo campo-itens-pagina">
                            <label for="itens-por-pagina">Itens por página</label>
                            <select id="itens-por-pagina">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                            </select>
                        </div>
                    </div>

                </section>

            </main>

        </div>


    </div>

    <!-- type="module" é obrigatório: permite usar import/export no script.js
         (necessário para os SDKs do Firebase, carregados via CDN) -->
    <script type="module" src="script.js"></script>

</body>

</html>
